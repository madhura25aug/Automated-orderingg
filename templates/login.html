{% extends "base.html" %}

{% block title %}Login - CanteenFlow AI{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card-custom p-4 shadow">
        <h3 class="fw-bold text-center mb-1">Welcome Back 👋</h3>
        <p class="text-muted text-center mb-4">Log in to CanteenFlow AI</p>

        <form method="POST" action="{{ url_for('auth.login') }}">
          <div class="mb-3">
            <label class="form-label font-weight-bold">Email Address</label>
            <input type="email" name="email" class="form-control form-control-lg" placeholder="e.g. student@canteenflow.com" required>
          </div>
          <div class="mb-4">
            <label class="form-label font-weight-bold">Password</label>
            <input type="password" name="password" class="form-control form-control-lg" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">Login</button>
        </form>

        <div class="mt-4 pt-3 border-top text-center">
          <p class="small text-muted mb-2">Hackathon Quick Demo Credentials:</p>
          <div class="d-flex justify-content-center gap-2">
            <a href="{{ url_for('auth.demo_login', role='student') }}" class="btn btn-sm btn-outline-primary">Student</a>
            <a href="{{ url_for('auth.demo_login', role='vendor') }}" class="btn btn-sm btn-outline-success">Vendor</a>
            <a href="{{ url_for('auth.demo_login', role='admin') }}" class="btn btn-sm btn-outline-purple">Admin</a>
          </div>
        </div>

        <div class="mt-3 text-center small">
          Don't have an account? <a href="{{ url_for('auth.register') }}">Register here</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
